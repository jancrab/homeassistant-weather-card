name: Bug report
description: Something in the weather card is broken or renders incorrectly.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Report a problem with this card below. Include the card YAML so the issue can be reproduced. For feature ideas or setup questions, open a blank issue.

  - type: checkboxes
    id: preflight
    attributes:
      label: Quick check
      options:
        - label: I'm on the latest version of the card and I searched for an existing issue.
          required: true

  - type: textarea
    id: card_config
    attributes:
      label: Card YAML configuration
      description: >-
        Card → three dots → "Show code editor", paste the whole thing.
      render: yaml
    validations:
      required: true

  - type: textarea
    id: what_happened
    attributes:
      label: What happened, and what did you expect instead?
    validations:
      required: true

  - type: input
    id: versions
    attributes:
      label: Card version and Home Assistant version
      placeholder: e.g. card 0.1.0, HA 2026.10.1
    validations:
      required: true

  - type: textarea
    id: details
    attributes:
      label: Anything else?
      description: >-
        Screenshots, steps to reproduce, the weather entity/integration you're using,
        or red errors from the browser console (F12 → Console). All optional,
        all make this much faster to fix.
